name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@onlyzoran'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install
        run: |
          npm update @onlyzoran/win-predict-ai-ui --package-lock-only
          npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lockfile for sync
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1

      - name: Build
        run: npm run build
        env:
          APP_URL: http://localhost:3000
          SESSION_SECRET: ci-build-secret
          ADMIN_EMAILS: ci@example.com
          DATABASE_PATH: .data/ci.sqlite
