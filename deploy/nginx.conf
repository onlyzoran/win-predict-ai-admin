# Single-origin host for admin (Nuxt), public Vue app, API, and ops status.
# Certbot will add listen 443 ssl and redirect once DNS points here.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name win-predict-ai.com www.win-predict-ai.com;

    client_max_body_size 2m;

    location = /ops {
        return 301 /ops/;
    }

    location ^~ /ops/ {
        alias /var/www/orchestrator-status/;
        index index.html;
        add_header Cache-Control "no-store";
    }

    # Public Vue SPA (history mode). Must be before location /.
    location /win-predict-ai/ {
        alias /var/www/win-predict-ai/dist/;
        try_files $uri $uri/ /win-predict-ai/index.html;
    }

    location /win-predict-ai-preview/ {
        alias /var/www/win-predict-ai-preview/;
        autoindex off;
        try_files $uri $uri/ =404;
    }

    # Admin Nuxt + Nitro /api/* (proxies sports to Nest :3001)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
